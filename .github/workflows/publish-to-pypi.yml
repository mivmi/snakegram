name: Publish to pypi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm:
        type: boolean
        required: true
        description: Publish to pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        py: [38, 39, 310, 311, 312, 313]

    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_SKIP: "*-win32 *-manylinux_i686"
          CIBW_BUILD: "cp${{ matrix.py }}-*"
          CIBW_BUILD_FRONTEND: "build"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_BEFORE_ALL_MACOS: "rustup target add aarch64-apple-darwin x86_64-apple-darwin"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install --upgrade build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  pypi-publish:
    runs-on: ubuntu-latest
    needs: [build, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: temp
          pattern: cibw-*
          merge-multiple: true

      - run: |
          mkdir -p dist
          find temp/ -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;
          echo "Contents of dist:"
          ls -l dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
