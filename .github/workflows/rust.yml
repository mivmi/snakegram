name: Rust

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.5"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            arch: armv7
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.11

      - name: Build wheel with maturin-action for ${{ matrix.os }} ${{ matrix.arch }}
        uses: PyO3/maturin-action@v1.43.0
        with:
          command: build
          args: --release --out extensions
          manylinux: auto
          sccache: true

      - name: GitHub Commit & Push
        uses: actions-js/push@v1.5
        with:
          message: "Release"
          github_token: ${{ secrets.GITHUB_TOKEN }}
